<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Employee Registration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0 2px 20px rgba(0,0,0,0.12);
        }
        label {
            display: block;
            margin-top: 16px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border-radius: 8px;
            border: 1px solid #ddd;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #2c64d6;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        .message {
            margin-top: 14px;
            font-size: 14px;
        }
        a {
            color: #2c64d6;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Employee Registration</h1>
        <label for="name">Name</label>
        <input id="name" type="text" placeholder="Your name">

        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com">

        <label for="department">Department</label>
        <input id="department" type="text" placeholder="Water Department">

        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Create a password">

        <button onclick="registerEmployee()">Register</button>

        <div id="message" class="message"></div>
        <div style="margin-top: 12px;">Already registered? <a href="dashboard.html">Login here</a></div>
    </div>

    <script>
        const API = 'http://127.0.0.1:5000';

        function registerEmployee(){
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const department = document.getElementById('department').value.trim();
            const password = document.getElementById('password').value;

            const message = document.getElementById('message');
            message.textContent = '';

            if(!name || !email || !department || !password){
                message.textContent = 'Please fill all fields.';
                message.style.color = 'red';
                return;
            }

            fetch(API + '/employee/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, department, password })
            })
            .then(res => res.json().then(data => ({status: res.status, body: data})))
            .then(result => {
                if(result.status !== 201){
                    message.textContent = result.body.error || 'Registration failed.';
                    message.style.color = 'red';
                    return;
                }
                message.textContent = 'Registration successful. You can now login.';
                message.style.color = 'green';
            })
            .catch(() => {
                message.textContent = 'Unable to connect to server.';
                message.style.color = 'red';
            });
        }
    </script>
</body>
</html>
