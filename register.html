<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Complaint Portal</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('bg.png') center/cover no-repeat fixed;
            color: #111827;
        }
        .container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            width: 100%;
            max-width: 480px;
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 12px 35px rgba(15, 23, 42, 0.12);
        }
        h1 { margin-top: 0; }
        form { display: grid; gap: 12px; }
        input, button { font: inherit; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            box-sizing: border-box;
        }
        button {
            border: none;
            padding: 12px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
        }
        .message { margin-top: 10px; padding: 10px 12px; border-radius: 10px; }
        .message.error { background: #fee2e2; color: #b91c1c; }
        .message.success { background: #dcfce7; color: #166534; }
        a { color: #2563eb; text-decoration: none; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>Create Citizen Account</h1>
        <form id="registerForm">
            <input id="name" type="text" placeholder="Full name" required />
            <input id="phone" type="text" placeholder="Phone number" required />
            <input id="email" type="email" placeholder="Email" required />
            <input id="password" type="password" placeholder="Password" required />
            <button type="submit">Register</button>
        </form>
        <div id="messageBox"></div>
        <p style="margin-top: 10px;"><a href="login.html">Already have an account? Login here</a></p>
    </div>
</div>

<script>
const API = 'http://127.0.0.1:5000';

function showMessage(text, type) {
    document.getElementById('messageBox').innerHTML = `<div class="message ${type}">${text}</div>`;
}

document.getElementById('registerForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    fetch(`${API}/citizen/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, phone, email, password })
    })
    .then(res => res.json().then(data => ({ status: res.status, data })))
    .then(result => {
        if (result.status !== 201) {
            showMessage(result.data.error || 'Registration failed', 'error');
            return;
        }
        showMessage('Registration successful. You can now login.', 'success');
        document.getElementById('registerForm').reset();
    })
    .catch(() => showMessage('Unable to connect to the server', 'error'));
});
</script>
</body>
</html>
