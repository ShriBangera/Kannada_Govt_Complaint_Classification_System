<!DOCTYPE html>
<html>
<head>
    <title>Kannada Grievance System</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            text-align: center;
            margin-top: 100px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 400px;
            margin: auto;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        .confidence {
            color: green;
            margin-top: 5px;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>📝 Kannada Grievance System</h2>

    <input type="text" id="text" placeholder="Enter complaint (e.g. ನೀರು ಸಮಸ್ಯೆ ಇದೆ)">
    <br>
    <button onclick="send()">Submit</button>

    <div id="result"></div>
    <div id="confidence" class="confidence"></div>
</div>

<script>
function send() {
    let text = document.getElementById("text").value;

    if (!text) {
        alert("Please enter a complaint");
        return;
    }

    fetch("http://127.0.0.1:5000/predict", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({text: text})
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("result").innerText = "📌 Category: " + data.category;
        document.getElementById("confidence").innerText = "✅ Confidence: " + data.confidence + "%";
    })
    .catch(err => {
        document.getElementById("result").innerText = "❌ Error connecting to server";
    });
}
</script>

</body>
</html>
